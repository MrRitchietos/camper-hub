; Camper hub on the CYD ESP32-2432S028 (ILI9342 320x240)
[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv   ; two app slots: updates from the SD card or the phone page
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -O2
  -DLV_CONF_INCLUDE_SIMPLE
  -Iinclude
  -DCORE_DEBUG_LEVEL=0
  -DFW_VERSION=\"1.1.3\"
  ; BLE: we only listen (observer) and later connect to one device (central)
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=1
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  lvgl/lvgl@9.2.2
  h2zero/NimBLE-Arduino@^2.2.0
  bblanchon/ArduinoJson@^7.2.1
  ; SD + Wire come with the Arduino core
